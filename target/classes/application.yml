spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:insurance_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.portfolio.insurance: INFO

app:
  security:
    admin:
      username: ${APP_ADMIN_USER:admin}
      password: ${APP_ADMIN_PASSWORD:admin123}
    user:
      username: ${APP_READONLY_USER:user}
      password: ${APP_READONLY_PASSWORD:user123}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
